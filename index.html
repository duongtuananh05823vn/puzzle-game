<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Puzzle Fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFC93C;
    --sky:#4EA8DE;
    --coral:#FF6B6B;
    --grass:#6BCB77;
    --plum:#5C3D99;
    --cream:#FFFDF7;
    --ink:#3A2E52;
    --radius:28px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 18%, rgba(255,201,60,0.35), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(78,168,222,0.30), transparent 42%),
      radial-gradient(circle at 20% 90%, rgba(107,203,119,0.30), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(255,107,107,0.28), transparent 42%),
      var(--cream);
    overflow-x:hidden;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:720px;
    padding:18px 16px 40px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Baloo 2',cursive; margin:0;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .logo{
    font-size:34px;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,0.08));
  }
  .brand h1{
    font-size:clamp(22px,5vw,30px);
    color:var(--plum);
  }
  .brand h1 span{color:var(--coral);}
  .iconbtn{
    border:none;
    background:#fff;
    width:48px;height:48px;
    border-radius:16px;
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 rgba(92,61,153,0.18);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .iconbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(92,61,153,0.18);}

  /* ---------- MENU ---------- */
  .subtitle{
    font-family:'Baloo 2';
    font-size:19px;
    color:var(--plum);
    margin:4px 0 18px;
  }
  .cat-grid{
    display:grid;
    gap:16px;
  }
  .cat-card{
    border:none;
    border-radius:var(--radius);
    padding:18px 20px;
    text-align:left;
    cursor:pointer;
    color:#fff;
    position:relative;
    overflow:hidden;
    box-shadow:0 6px 0 rgba(0,0,0,0.12);
    transition:transform .12s ease;
    font-family:'Nunito';
  }
  .cat-card:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.12);}
  .cat-card h2{font-size:24px; margin-bottom:4px;}
  .cat-card p{margin:0; opacity:.92; font-weight:700;}
  .cat-card .blob{
    position:absolute;
    right:-18px; top:-18px;
    font-size:84px;
    opacity:.35;
    transform:rotate(12deg);
  }
  .cat-a{background:linear-gradient(135deg,#FF9A6B,var(--coral));}
  .cat-b{background:linear-gradient(135deg,#6FD3E0,var(--sky));}
  .cat-c{background:linear-gradient(135deg,#9AE07A,var(--grass));}

  .item-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .item-card{
    border:none;
    border-radius:20px;
    background:#fff;
    padding:14px 6px 10px;
    box-shadow:0 5px 0 rgba(92,61,153,0.15);
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .12s ease;
  }
  .item-card:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(92,61,153,0.15);}
  .item-card .emo{font-size:38px;}
  .item-card span{font-family:'Baloo 2'; font-size:13px; color:var(--plum); text-align:center;}
  .item-card.done{outline:3px solid var(--grass);}
  .item-card .star{font-size:11px; color:var(--grass);}

  /* ---------- PUZZLE ---------- */
  .puzzle-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
    gap:8px;
  }
  .puzzle-header h2{font-size:19px;color:var(--plum);}
  .preview-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border-radius:20px;
    padding:10px 14px;
    box-shadow:0 5px 0 rgba(92,61,153,0.15);
    margin-bottom:16px;
  }
  .preview-thumb{
    width:64px;height:64px;
    border-radius:14px;
    background-repeat:no-repeat;
    background-size:cover;
    flex:none;
    box-shadow:0 3px 0 rgba(92,61,153,0.2);
  }
  .preview-text{
    font-family:'Baloo 2';
    color:var(--plum);
    font-size:14px;
    line-height:1.3;
  }
  .preview-text b{display:block; font-size:16px;}
  .board-wrap{
    background:#fff;
    border-radius:var(--radius);
    padding:14px;
    box-shadow:0 6px 0 rgba(92,61,153,0.15);
    margin-bottom:18px;
  }
  .board{
    display:grid;
    gap:4px;
    width:100%;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    background:repeating-conic-gradient(#eee 0% 25%, #f7f7f7 0% 50%) 0 0/24px 24px;
  }
  .slot{
    position:relative;
    background:rgba(92,61,153,0.06);
    border:2px dashed rgba(92,61,153,0.25);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, border-color .15s ease;
    cursor:pointer;
  }
  .slot.hover-ok{background:rgba(107,203,119,0.35); border-color:var(--grass);}
  .slot.filled{border-style:solid; border-color:transparent; cursor:default;}
  .piece-face{
    width:100%;height:100%;
    background-repeat:no-repeat;
    border-radius:6px;
  }
  .tray-label{
    font-family:'Baloo 2';
    color:var(--plum);
    font-size:15px;
    margin:0 0 8px 4px;
  }
  .tray{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    background:rgba(255,255,255,0.6);
    border:2px dashed rgba(92,61,153,0.25);
    border-radius:20px;
    padding:14px;
    min-height:96px;
  }
  .piece{
    width:78px;height:78px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(92,61,153,0.25);
    background-repeat:no-repeat;
    touch-action:none;
    animation:pop .25s ease;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .piece.selected{
    transform:translateY(-6px) scale(1.06);
    box-shadow:0 0 0 4px var(--sun), 0 8px 0 rgba(92,61,153,0.25);
  }
  .piece.dragging{
    position:fixed;
    z-index:50;
    pointer-events:none;
    box-shadow:0 10px 18px rgba(0,0,0,0.25);
    transform:scale(1.08) rotate(-2deg);
  }
  @keyframes pop{from{transform:scale(.5); opacity:0;} to{transform:scale(1); opacity:1;}}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  .shake{animation:shake .35s ease;}

  .backbtn{
    background:#fff;
    border:none;
    border-radius:14px;
    padding:10px 16px;
    font-family:'Baloo 2';
    font-size:15px;
    color:var(--plum);
    box-shadow:0 4px 0 rgba(92,61,153,0.18);
    cursor:pointer;
    flex:none;
  }
  .backbtn:active{transform:translateY(3px);}

  /* ---------- WIN OVERLAY ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(58,46,82,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
    animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  .win-card{
    background:var(--cream);
    border-radius:32px;
    padding:28px 24px 24px;
    text-align:center;
    max-width:360px;
    width:100%;
    box-shadow:0 12px 0 rgba(0,0,0,0.2);
  }
  .win-emo{font-size:64px; display:block; margin-bottom:6px;}
  .win-card h2{color:var(--plum); font-size:26px; margin-bottom:6px;}
  .win-card p{margin:0 0 18px; font-weight:700; color:var(--ink);}
  .win-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .win-actions button{
    border:none;
    border-radius:16px;
    padding:12px 18px;
    font-family:'Baloo 2';
    font-size:15px;
    cursor:pointer;
    color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,0.15);
  }
  .win-actions button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.15);}
  .btn-next{background:var(--grass);}
  .btn-menu{background:var(--sky);}

  #confetti{
    position:fixed; inset:0; pointer-events:none; z-index:99;
  }

  @media (max-width:380px){
    .piece{width:64px;height:64px;}
    .preview-thumb{width:52px;height:52px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>

<script>
(function(){
  "use strict";

  /* ---------------- DATA ---------------- */
  const CATEGORIES = [
    {
      id:'animals', name:'Animals', cls:'cat-a', blob:'🐵',
      desc:'Puzzle cute animal friends',
      items:[
        {emo:'🐶', name:'Puppy'},
        {emo:'🐱', name:'Kitten'},
        {emo:'🦁', name:'Lion'},
        {emo:'🐼', name:'Panda'},
        {emo:'🐸', name:'Frog'},
        {emo:'🦉', name:'Owl'},
        {emo:'🐰', name:'Rabbit'},
        {emo:'🐷', name:'Piglet'},
        {emo:'🐨', name:'Koala'},
        {emo:'🦊', name:'Fox'},
        {emo:'🐯', name:'Tiger'},
        {emo:'🐮', name:'Cow'},
      ]
    },
    {
      id:'food', name:'Food', cls:'cat-b', blob:'🍕',
      desc:'Puzzle tasty treats',
      items:[
        {emo:'🍎', name:'Apple'},
        {emo:'🍌', name:'Banana'},
        {emo:'🍕', name:'Pizza'},
        {emo:'🍩', name:'Donut'},
        {emo:'🍓', name:'Strawberry'},
        {emo:'🍉', name:'Watermelon'},
        {emo:'🍒', name:'Cherries'},
        {emo:'🍑', name:'Peach'},
        {emo:'🥕', name:'Carrot'},
        {emo:'🍔', name:'Burger'},
        {emo:'🍦', name:'Ice Cream'},
        {emo:'🧀', name:'Cheese'},
      ]
    },
    {
      id:'shapes', name:'Shapes', cls:'cat-c', blob:'⭐',
      desc:'Puzzle colorful shapes & icons',
      items:[
        {emo:'⭐', name:'Star'},
        {emo:'❤️', name:'Heart'},
        {emo:'🔵', name:'Circle'},
        {emo:'🔺', name:'Triangle'},
        {emo:'💎', name:'Diamond'},
        {emo:'🌙', name:'Moon'},
        {emo:'🟦', name:'Square'},
        {emo:'☀️', name:'Sun'},
        {emo:'☁️', name:'Cloud'},
        {emo:'🌈', name:'Rainbow'},
        {emo:'🌸', name:'Flower'},
        {emo:'⚡', name:'Lightning'},
      ]
    }
  ];

  const GRID = 3;              // 3x3 = 9 pieces
  const IMG_SIZE = 300;        // source canvas size 300x300
  const PIECE_PALETTE = ['#FF6B6B','#4EA8DE','#6BCB77','#FFC93C','#9C6ADE','#FF9F45'];

  let state = {
    screen:'menu',      // menu | items | puzzle
    catIndex:0,
    itemIndex:0,
    completed:{}        // "catId-itemIndex" -> true
  };

  const app = document.getElementById('app');

  /* ---------------- AUDIO ---------------- */
  let actx;
  function ctx(){
    if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); }
    return actx;
  }
  function tone(freq, dur, type, delay){
    try{
      const c = ctx();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type||'sine';
      o.frequency.value = freq;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(c.destination);
      const t0 = c.currentTime + (delay||0);
      g.gain.exponentialRampToValueAtTime(0.18, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.start(t0);
      o.stop(t0+dur+0.02);
    }catch(e){}
  }
  function soundCorrect(){ tone(660,0.18,'triangle',0); tone(880,0.18,'triangle',0.09); }
  function soundWrong(){ tone(180,0.18,'sawtooth',0); }
  function soundWin(){
    [523,659,784,1046].forEach((f,i)=> tone(f,0.22,'triangle',i*0.12));
  }

  /* ---------------- IMAGE SLICING ---------------- */
  function buildSourceImage(emoji, seedIndex){
    const c = document.createElement('canvas');
    c.width = IMG_SIZE; c.height = IMG_SIZE;
    const g = c.getContext('2d');
    const bg1 = PIECE_PALETTE[seedIndex % PIECE_PALETTE.length];
    const bg2 = PIECE_PALETTE[(seedIndex+2) % PIECE_PALETTE.length];
    const grad = g.createLinearGradient(0,0,IMG_SIZE,IMG_SIZE);
    grad.addColorStop(0,bg1); grad.addColorStop(1,bg2);
    g.fillStyle = grad;
    g.fillRect(0,0,IMG_SIZE,IMG_SIZE);
    // soft white circle behind the emoji for contrast
    g.beginPath();
    g.arc(IMG_SIZE/2, IMG_SIZE/2, IMG_SIZE*0.4, 0, Math.PI*2);
    g.fillStyle = 'rgba(255,255,255,0.25)';
    g.fill();
    g.font = (IMG_SIZE*0.62)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';
    g.textBaseline='middle';
    g.fillText(emoji, IMG_SIZE/2, IMG_SIZE/2 + IMG_SIZE*0.03);
    return c.toDataURL('image/png');
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  /* ---------------- RENDER: MENU ---------------- */
  function renderMenu(){
    state.screen='menu';
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="logo">🧩</span><h1>Puzzle <span>Fun</span></h1></div>
      </div>
      <p class="subtitle">Pick a theme to start playing!</p>
      <div class="cat-grid" id="catGrid"></div>
    `;
    const grid = document.getElementById('catGrid');
    CATEGORIES.forEach((cat, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'cat-card ' + cat.cls;
      btn.innerHTML = `<span class="blob">${cat.blob}</span><h2>${cat.name}</h2><p>${cat.desc}</p>`;
      btn.onclick = ()=>{ state.catIndex = idx; renderItems(); };
      grid.appendChild(btn);
    });
  }

  /* ---------------- RENDER: ITEM PICKER ---------------- */
  function renderItems(){
    state.screen='items';
    const cat = CATEGORIES[state.catIndex];
    app.innerHTML = `
      <div class="topbar">
        <button class="iconbtn" id="backBtn">←</button>
        <h1 style="font-size:22px;color:var(--plum);">${cat.name}</h1>
        <span style="width:48px;"></span>
      </div>
      <p class="subtitle">Choose a picture to puzzle</p>
      <div class="item-grid" id="itemGrid"></div>
    `;
    document.getElementById('backBtn').onclick = renderMenu;
    const grid = document.getElementById('itemGrid');
    cat.items.forEach((it, idx)=>{
      const key = cat.id+'-'+idx;
      const done = !!state.completed[key];
      const btn = document.createElement('button');
      btn.className = 'item-card' + (done?' done':'');
      btn.innerHTML = `<span class="emo">${it.emo}</span><span>${it.name}</span>${done?'<span class="star">⭐ Done</span>':''}`;
      btn.onclick = ()=>{ state.itemIndex = idx; renderPuzzle(); };
      grid.appendChild(btn);
    });
  }

  /* ---------------- RENDER: PUZZLE ---------------- */
  function renderPuzzle(){
    state.screen='puzzle';
    const cat = CATEGORIES[state.catIndex];
    const item = cat.items[state.itemIndex];
    const seed = state.catIndex*10 + state.itemIndex;
    const imgURL = buildSourceImage(item.emo, seed);
    const total = GRID*GRID;

    app.innerHTML = `
      <div class="puzzle-header">
        <button class="backbtn" id="backBtn">← Back</button>
        <h2>${item.emo} ${item.name}</h2>
        <span style="width:70px;"></span>
      </div>
      <div class="preview-wrap">
        <div class="preview-thumb" style="background-image:url(${imgURL});"></div>
        <div class="preview-text">Sample picture<b>${item.name} ${item.emo}</b></div>
      </div>
      <div class="board-wrap">
        <div class="board" id="board" style="grid-template-columns:repeat(${GRID},1fr);"></div>
      </div>
      <p class="tray-label">Drag or tap a piece, then tap its spot 👇</p>
      <div class="tray" id="tray"></div>
    `;
    document.getElementById('backBtn').onclick = renderItems;

    const board = document.getElementById('board');
    const tray = document.getElementById('tray');

    // Build board slots
    const slots = [];
    for(let i=0;i<total;i++){
      const slot = document.createElement('div');
      slot.className='slot';
      slot.dataset.index=i;
      slot.addEventListener('click', ()=> handleSlotClick(slot));
      board.appendChild(slot);
      slots.push(slot);
    }

    // Build pieces (shuffled)
    const order = shuffle([...Array(total).keys()]);
    let filledCount = 0;
    let selectedPiece = null;

    order.forEach(i=>{
      const row = Math.floor(i/GRID), col = i%GRID;
      const piece = document.createElement('div');
      piece.className='piece';
      piece.dataset.index=i;
      piece.style.backgroundImage = `url(${imgURL})`;
      piece.style.backgroundSize = `${GRID*100}% ${GRID*100}%`;
      piece.style.backgroundPosition = `${col*100/(GRID-1)}% ${row*100/(GRID-1)}%`;
      tray.appendChild(piece);
      attachInteraction(piece);
    });

    function selectPiece(piece){
      if(selectedPiece) selectedPiece.classList.remove('selected');
      if(selectedPiece === piece){
        selectedPiece = null;
        return;
      }
      selectedPiece = piece;
      piece.classList.add('selected');
    }

    function handleSlotClick(slot){
      if(!selectedPiece || slot.classList.contains('filled')) return;
      tryPlace(selectedPiece, slot);
      selectedPiece = null;
    }

    function tryPlace(piece, slot){
      if(slot.dataset.index === piece.dataset.index){
        piece.classList.remove('selected','dragging');
        piece.style.position='';
        piece.style.left=''; piece.style.top='';
        piece.style.width='100%'; piece.style.height='100%';
        piece.style.cursor='default';
        piece.classList.add('piece-face');
        slot.appendChild(piece);
        slot.classList.add('filled');
        filledCount++;
        soundCorrect();
        burstConfettiAt(slot.getBoundingClientRect());
        if(filledCount===total){
          setTimeout(()=>showWin(cat,item), 350);
        }
      } else {
        piece.classList.remove('selected');
        piece.classList.add('shake');
        soundWrong();
        setTimeout(()=>piece.classList.remove('shake'), 360);
      }
    }

    function attachInteraction(piece){
      let dragging = false;
      let startX=0, startY=0;

      piece.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        dragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = piece.getBoundingClientRect();
        const offX = e.clientX - rect.left;
        const offY = e.clientY - rect.top;
        const w = rect.width, h = rect.height;
        const startParent = piece.parentElement;

        function beginDrag(){
          dragging = true;
          if(selectedPiece) { selectedPiece.classList.remove('selected'); selectedPiece=null; }
          piece.classList.add('dragging');
          piece.style.width = w+'px';
          piece.style.height = h+'px';
          document.body.appendChild(piece);
          movePiece(e.clientX, e.clientY);
        }
        function movePiece(x,y){
          piece.style.left = (x-offX)+'px';
          piece.style.top = (y-offY)+'px';
        }
        function onMove(ev){
          const dx = ev.clientX-startX, dy = ev.clientY-startY;
          if(!dragging && Math.hypot(dx,dy) > 6){
            beginDrag();
          }
          if(dragging){
            movePiece(ev.clientX, ev.clientY);
            document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover-ok'));
            const el = document.elementFromPoint(ev.clientX, ev.clientY);
            const slot = el && el.closest && el.closest('.slot');
            if(slot && !slot.classList.contains('filled') && slot.dataset.index===piece.dataset.index){
              slot.classList.add('hover-ok');
            }
          }
        }
        function onUp(ev){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);

          if(!dragging){
            // treat as a click/tap -> select piece
            selectPiece(piece);
            return;
          }

          document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover-ok'));
          const el = document.elementFromPoint(ev.clientX, ev.clientY);
          const slot = el && el.closest && el.closest('.slot');
          piece.classList.remove('dragging');

          if(slot && !slot.classList.contains('filled')){
            piece.style.position='';
            piece.style.left=''; piece.style.top='';
            piece.style.width=''; piece.style.height='';
            tryPlace(piece, slot);
            if(piece.parentElement !== slot){
              // wrong slot, returned to tray
              tray.appendChild(piece);
            }
          } else {
            piece.style.position='';
            piece.style.left=''; piece.style.top='';
            piece.style.width=''; piece.style.height='';
            tray.appendChild(piece);
          }
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }
  }

  function showWin(cat, item){
    soundWin();
    burstConfettiFull();
    const key = cat.id+'-'+state.itemIndex;
    state.completed[key] = true;

    const overlay = document.createElement('div');
    overlay.className='overlay';
    overlay.innerHTML = `
      <div class="win-card">
        <span class="win-emo">🎉</span>
        <h2>Great job!</h2>
        <p>You finished the ${item.name} ${item.emo} puzzle</p>
        <div class="win-actions">
          <button class="btn-next" id="nextBtn">Next Picture</button>
          <button class="btn-menu" id="menuBtn">Change Theme</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('nextBtn').onclick = ()=>{
      overlay.remove();
      const items = CATEGORIES[state.catIndex].items;
      state.itemIndex = (state.itemIndex+1) % items.length;
      renderPuzzle();
    };
    document.getElementById('menuBtn').onclick = ()=>{
      overlay.remove();
      renderItems();
    };
  }

  /* ---------------- CONFETTI ---------------- */
  const confettiCanvas = document.getElementById('confetti');
  const cctx = confettiCanvas.getContext('2d');
  function resizeConfetti(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  let particles = [];
  function burstConfettiAt(rect){
    spawnParticles(rect.left+rect.width/2, rect.top+rect.height/2, 10);
  }
  function burstConfettiFull(){
    spawnParticles(window.innerWidth/2, window.innerHeight*0.3, 60);
  }
  function spawnParticles(x,y,n){
    for(let i=0;i<n;i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*8,
        vy:Math.random()*-8-2,
        g:0.35,
        size:5+Math.random()*5,
        color: PIECE_PALETTE[Math.floor(Math.random()*PIECE_PALETTE.length)],
        life:60+Math.random()*30,
        rot:Math.random()*Math.PI*2,
        vr:(Math.random()-0.5)*0.3
      });
    }
    if(!animRunning){ animRunning=true; requestAnimationFrame(loop); }
  }
  let animRunning=false;
  function loop(){
    cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    particles.forEach(p=>{
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life--;
      cctx.save();
      cctx.translate(p.x,p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      cctx.restore();
    });
    particles = particles.filter(p=>p.life>0 && p.y < confettiCanvas.height+40);
    if(particles.length>0){
      requestAnimationFrame(loop);
    } else {
      animRunning=false;
      cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    }
  }

  renderMenu();
})();
</script>
</body>
</html>
